name: CI and Deploy

on:
  pull_request:
  push:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare reports directory
        run: mkdir -p reports

      - name: Build and start stack
        run:  cp .env.example .env || true
              docker compose --env-file .env.example up -d --build

      - name: Wait for health
        run: |
          for i in $(seq 1 60); do
            if docker compose exec -T api python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"; then
              echo "API healthy"
              break
            fi
            sleep 1
            if [ "$i" -eq 60 ]; then
              echo "API did not become healthy in time."
              docker compose ps
              docker compose logs --no-color --tail=200
              exit 1
            fi
          done
          echo "API did not become healthy in time."
          exit 1

      - name: Ruff
        run: docker compose run --rm api ruff check .

      - name: Pytest
        run: docker compose run --rm api pytest

      - name: Contract tests
        run: docker compose run --rm api bash /app/scripts/contract_test.sh

      - name: Ensure JUnit report exists
        if: always()
        run: mkdir -p reports && touch reports/junit.xml

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-tests-junit
          path: reports/junit.xml

      - name: Tear down stack
        if: always()
        run: docker compose down -v

  deploy:
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to Hetzner
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: ${{ secrets.HETZNER_PORT || 22 }}
          script: bash /opt/ppd-api/scripts/deploy_remote.sh
