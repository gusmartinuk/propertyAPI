name: CI

on:
  pull_request:
  push:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare reports directory
        run: mkdir -p reports

      - name: Build and start stack
        run: docker compose up -d --build

      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy in time."
          exit 1

      - name: Ruff
        run: docker compose run --rm api ruff check .

      - name: Pytest
        run: docker compose run --rm api pytest

      - name: Contract tests
        run: docker compose run --rm api bash /app/scripts/contract_test.sh

      - name: Ensure JUnit report exists
        if: always()
        run: mkdir -p reports && touch reports/junit.xml

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-tests-junit
          path: reports/junit.xml

      - name: Tear down stack
        if: always()
        run: docker compose down -v
